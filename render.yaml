services:
  - type: web
    name: homemart4u-backend
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_MOBILE
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: UPI_VPA
        sync: false
      - key: NEXT_PUBLIC_UPI_MERCHANT_NAME
        value: homemart4u
      - key: SUPPORT_PHONE_NUMBER
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_PHONE_NUMBER
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENTS_ENABLED
        value: "true"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
